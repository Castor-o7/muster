name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Backstop so a stuck step fails in minutes instead of GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # libssl-dev: myko's WebSocket client uses native-tls (OpenSSL on Linux).
      # zsh: scripts/test-gate-e2e.sh.
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev zsh netcat-openbsd
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Gate end-to-end (TLS, pairing, tokens)
        run: cargo build --workspace && ./scripts/test-gate-e2e.sh

  # muster-shim's Windows code is `#[cfg(windows)]`, invisible to the Linux job
  # above; cross-compiling it catches a Windows-only build break.
  windows-cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config mingw-w64
      - name: Cross-compile the Windows shim
        run: cargo check -p muster-shim --target x86_64-pc-windows-gnu

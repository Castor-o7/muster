name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Backstop so a stuck step fails in minutes instead of GitHub's 6-hour default.
    timeout-minutes: 30
    env:
      # Full debuginfo was most of target/ and filled the runner's disk while
      # conformance rebuilt the workspace (MUS-87). Line tables keep file and
      # line numbers in backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    # The conformance suite's restart cells persist to Postgres (MUS-76).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conformance
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conformance"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      # The hosted image ships SDKs this job never uses; removing them leaves
      # room for the workspace builds and the plugins' node_modules (MUS-87).
      # Rust comes from rustup in ~/.rustup, python3 and node from the system.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          df -h /
      # libssl-dev: myko's WebSocket client uses native-tls (OpenSSL on Linux).
      # zsh: scripts/test-gate-e2e.sh.
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev zsh netcat-openbsd
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Each published crate ships its own copy of the licences; they must
      # match the root files exactly.
      - name: Crate licence copies match the root
        run: |
          status=0
          for crate in entities daemon shim tui; do
            for f in LICENSE-MIT LICENSE-APACHE; do
              if ! cmp -s "$f" "crates/$crate/$f"; then
                echo "::error file=crates/$crate/$f::differs from the root $f (or is missing)"
                status=1
              fi
            done
          done
          exit $status
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Gate end-to-end (TLS, pairing, tokens)
        run: cargo build --workspace && ./scripts/test-gate-e2e.sh
      - name: Links between daemons end-to-end (MUS-66)
        run: ./scripts/test-links-e2e.sh
      # MUS-58: the sweeper starts only once myko has replayed Postgres, so an
      # ad-hoc room membership survives a restart. Uses the job's Postgres
      # service, in a table of its own.
      - name: Restart with Postgres end-to-end (MUS-58)
        env:
          RESTART_E2E_POSTGRES_URL: postgres://conformance:conformance@127.0.0.1:5432/conformance
        run: ./scripts/test-restart-e2e.sh
      # The TypeScript plugins' fakes run under bun (MUS-69 stage 3). Download
      # the pinned release from bun's GitHub releases and check it against the
      # SHA-256 below, from that release's SHASUMS256.txt. No third-party
      # action and no npm postinstall.
      - name: Install bun (pinned and checked)
        env:
          BUN_VERSION: "1.3.14"
          BUN_SHA256: "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
        run: |
          # GitHub's release downloads sometimes answer 504 (MUS-87); the
          # checksum below still decides what runs.
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/bun-linux-x64/bun" --version
          echo "MUSTER_BUN=$RUNNER_TEMP/bun-linux-x64/bun" >> "$GITHUB_ENV"
      # Each plugin's own lockfile, outside the root workspace, with no
      # install scripts.
      - name: Install the plugins' locked dependencies
        run: |
          for plugin in muster-pi muster-opencode muster-prime-agent; do
            (cd "plugins/$plugin" && npm ci --workspaces=false --no-audit --no-fund --ignore-scripts)
          done
      # The pi plugin's own unit tests (MUS-81: the inbox pull, the push
      # hold and its lease). The other plugins' suites aren't run here yet.
      - name: Pi plugin unit tests
        working-directory: plugins/muster-pi
        run: '"$MUSTER_BUN" test'
      # MUS-69: every harness against one scenario table, with the real
      # binaries; prints the harness × scenario grid. Known failures are listed
      # in the test and reported as such.
      - name: Delivery conformance
        env:
          # A missing bun fails the plugins' cells instead of skipping them.
          CONFORMANCE_REQUIRE_BUN: "1"
          # And a missing database fails the restart cells that need one.
          CONFORMANCE_POSTGRES_URL: postgres://conformance:conformance@127.0.0.1:5432/conformance
          CONFORMANCE_REQUIRE_POSTGRES: "1"
        run: cargo build --workspace && cargo test -p muster-shim --test conformance -- --ignored --nocapture
      - name: Test simulation fixture and scoring contracts
        run: python3 -m unittest discover -s scripts/sandbox -v
      # How much room the job left, kept in the log even when a step failed (MUS-87).
      - name: Disk headroom
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true

  # The workspace tests on macOS (MUS-13), where operators run Muster day to day:
  # Apple Silicon, the system's TLS (Security.framework rather than OpenSSL) and
  # /var -> /private/var paths are all things the Linux job can't see. It runs
  # beside the Linux job, not after it, and caches cargo, so CI takes no longer.
  # The end-to-end scripts and conformance stay on Linux, which has their
  # Postgres service.
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # muster-shim's Windows code is `#[cfg(windows)]`, invisible to the Linux job
  # above; cross-compiling it catches a Windows-only build break.
  windows-cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # Only the x86_64 C cross-compiler: the build scripts compile C for the
      # target (ring, aws-lc-sys, rquickjs-sys). The `mingw-w64` metapackage
      # also pulled the i686 and C++ toolchains, 278 MB, and on a throttled
      # mirror that download alone ran past the job's limit (MUS-91).
      # build-essential and pkg-config come with the image. The step's own
      # limit makes a stalled mirror fail in minutes, naming this step.
      # The mirror is still sometimes too slow even for the C compiler alone
      # (#134's run hit the step limit), so the .debs are cached (MUS-91). On a
      # cache hit the install never touches the mirror. The key carries the
      # runner image's version, so a new image fetches its own packages once.
      # ImageOS and ImageVersion are set in the runner's shell environment, not
      # in the workflow's `env` context, so `${{ env.ImageOS }}` is empty there
      # (#137's first run keyed on `mingw-debs-Linux---...`). This step reads
      # them from the shell and hands them to the key.
      - name: Read the runner image
        id: runner-image
        run: |
          test -n "$ImageOS" && test -n "$ImageVersion"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "runner image: $ImageOS-$ImageVersion"
      - name: Cache the mingw packages
        id: mingw-cache
        uses: actions/cache@v4
        with:
          path: ~/mingw-debs
          key: mingw-debs-${{ runner.os }}-${{ steps.runner-image.outputs.image }}-gcc-mingw-w64-x86-64-v1
      - name: Install the mingw C cross-compiler
        timeout-minutes: 8
        run: |
          if ls ~/mingw-debs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/mingw-debs/*.deb; then
            echo "installed from the cache: $(ls ~/mingw-debs/*.deb | wc -l) packages"
          else
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends --download-only gcc-mingw-w64-x86-64
            mkdir -p ~/mingw-debs
            cp /var/cache/apt/archives/*.deb ~/mingw-debs/
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-mingw-w64-x86-64
            echo "fetched from the mirror: $(ls ~/mingw-debs/*.deb | wc -l) packages, cached for next time"
          fi
          x86_64-w64-mingw32-gcc --version | head -1
      - name: Cross-compile the Windows shim
        run: cargo check -p muster-shim --target x86_64-pc-windows-gnu

  # Dependency audit (MUS-11): advisories, licences, bans and sources, as
  # configured in deny.toml. Every ignored advisory there says why. cargo-deny
  # is built from crates.io at a pinned version, so no third-party action runs.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny check

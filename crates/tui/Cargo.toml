[package]
name = "muster-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Terminal dashboard for the Muster coordination daemon: a live view of the session roster and recent messages."
repository = "https://github.com/Castor-o7/muster"
keywords = ["tui", "ratatui", "agents", "dashboard", "messaging"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "muster-tui"
path = "src/main.rs"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
myko = { workspace = true }
hyphae = { workspace = true }
muster-entities = { workspace = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }

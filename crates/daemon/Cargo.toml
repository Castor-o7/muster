[package]
name = "muster-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Muster coordination daemon: keeps the roster of coding-agent sessions and routes messages between them, with a TLS gate for paired machines."
repository = "https://github.com/Castor-o7/muster"
keywords = ["agents", "coordination", "messaging", "daemon", "claude-code"]
categories = ["network-programming", "command-line-utilities"]
readme = "README.md"

[lib]
name = "daemon"

[[bin]]
name = "muster-daemon"
path = "src/main.rs"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
myko = { workspace = true }
myko-server = { workspace = true }
hyphae = { workspace = true }
muster-entities = { workspace = true }
notify-debouncer-mini = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { workspace = true }
gethostname = "1"
rustls = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
ciborium = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
getrandom = "0.3"
base64 = "0.22"

[dev-dependencies]
serde_json = "1"
chrono = { workspace = true }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
hyphae = { workspace = true }

# Dependency audit. CI runs `cargo deny check`.

[graph]
all-features = true
# These four come from ignition-is-go's git repositories, for the web UI only
# (marshal-ui), and declare no licence in their manifests, so cargo-deny can't
# check them. Excluded by name so the check still covers everything else;
# declaring a licence in them would let this list go.
# Excluding css-styled-derive also drops what only it pulls in, including
# rkyv 0.7 (RUSTSEC-2026-0235, unsafe archive validation). That is build-time
# only, inside the derive macro, and its fix needs parcel_sourcemap on rkyv 0.8.
exclude = [
  "mullion",
  "css-styled",
  "css-styled-derive",
  "css-spec-data",
]

[advisories]
# Every advisory fails the check unless it's listed here with the reason it
# can't reach Marshal at runtime, and what would let us drop the entry.
ignore = [
  # Unmaintained, not vulnerable: compile-time macros under leptos (web UI).
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc macro under leptos, compile time only" },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: unmaintained proc macro under leptos, compile time only" },
  # Unmaintained, not vulnerable: only myko's optional TypeScript code generation
  # (the entities crate's `ts-export` feature) pulls it in; no binary uses it.
  { id = "RUSTSEC-2026-0249", reason = "smartstring: only under myko's optional codegen-ts feature, not in any binary" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "CC0-1.0",
]
# myko and its crates are AGPL-3.0-or-later, and Marshal depends on them by
# design. Listed per crate so no other AGPL dependency slips in unnoticed.
exceptions = [
  { name = "myko", allow = ["AGPL-3.0-or-later"] },
  { name = "myko-macros", allow = ["AGPL-3.0-or-later"] },
  { name = "myko-server", allow = ["AGPL-3.0-or-later"] },
  { name = "myko-leptos", allow = ["AGPL-3.0-or-later"] },
  { name = "autosocket", allow = ["AGPL-3.0-or-later"] },
]

[bans]
# Duplicate versions are common in this tree (two webpki-roots, for one); warn
# rather than fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The web UI's components come from these git repositories.
allow-git = [
  "https://github.com/ignition-is-go/css-styled.git",
  "https://github.com/ignition-is-go/mullion.git",
]

[workspace]
resolver = "2"
members = ["crates/entities", "crates/daemon", "crates/shim", "crates/tui", "crates/ui"]
# vendor/myko-server is a patched dependency, not a member (MUS-59).
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# hyphae 3.1.9 (no declared rust-version) calls AtomicUsize::try_update,
# stable since 1.95; time and ratatui alone would need 1.88.
rust-version = "1.95"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
notify-debouncer-mini = "0.7"
futures-util = "0.3"
tokio-tungstenite = "0.29"

# TLS for the daemon gate and the shim tunnel. ring only, so no C toolchain
# (cmake/nasm) is needed for aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# Myko stack — pulled from crates.io; myko-server is patched (see [patch.crates-io] below). It ships the
# HTTP MCP router (POST /myko/mcp request/response + SSE) and the
# `mcp::filter` tool-visibility allowlist the pull model relies on.
# Keep the core and code-generating macros on the same release.
myko = "=6.11.5"
myko-macros = "=6.11.5"
myko-server = "=6.11.5"
myko-leptos = "=6.11.5"
hyphae = "3.1.2"

# Local crates. `version` is required so `cargo publish` accepts the
# path dep — flux stamps both this and `workspace.package.version` to
# keep them in sync. The dep key matches the published crates.io
# name so cargo-flux's workspace topology resolution works (it keys
# the cross-crate publish graph on the dep key, not the `package =`
# alias). Source code uses `use muster_entities::...` — the auto
# dash→underscore conversion Rust applies to crate names.
muster-entities = { path = "crates/entities", version = "0.1.0" }

# MUS-59: myko-server with a request filter, so myko's own listener refuses
# browser origins and anything without the local token. AGPL-3.0-or-later, like
# the crate it patches; see vendor/myko-server/MUSTER-PATCH.md. Drop this once
# upstream ships an equivalent hook.
[patch.crates-io]
myko-server = { path = "vendor/myko-server" }
